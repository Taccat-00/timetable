<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="可切换周数的 2026 秋季学期课表。">
  <meta name="theme-color" content="#0c0c0c">
  <title>课表</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23d7ff65'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='30' font-family='sans-serif' font-weight='700' fill='%230c0c0c'%3E%E8%AF%BE%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #0c0c0c;
      --paper: #f4f4ef;
      --muted: #8d8d85;
      --line: rgba(255,255,255,.13);
      --lime: #d7ff65;
      --row: 136px;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; color: var(--paper); background: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .shell { width: min(calc(100% - 40px), 1520px); margin-inline: auto; }

    .toolbar {
      position: sticky; top: 0; z-index: 30;
      border-bottom: 1px solid var(--line);
      background: rgba(12,12,12,.9); backdrop-filter: blur(18px);
    }
    .toolbar-inner {
      min-height: 78px; display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 24px;
    }
    .title-wrap { display: flex; align-items: center; gap: 11px; }
    .mark { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); background: var(--lime); font-size: 12px; font-weight: 800; }
    h1 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .week-summary { text-align: center; }
    .week-summary strong { display: block; font-size: 16px; letter-spacing: -.02em; }
    .week-summary span { display: block; margin-top: 3px; color: var(--muted); font: 10px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .controls { justify-self: end; display: flex; align-items: center; gap: 7px; }
    .icon-button, .week-select {
      height: 40px; border: 1px solid var(--line); color: var(--paper); background: #151515;
    }
    .icon-button { width: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; transition: color .2s, background .2s, border-color .2s; }
    .icon-button:hover:not(:disabled) { color: var(--ink); border-color: var(--lime); background: var(--lime); }
    .icon-button:disabled { opacity: .28; cursor: not-allowed; }
    .week-select { min-width: 96px; padding: 0 32px 0 14px; border-radius: 999px; cursor: pointer; color-scheme: dark; }

    .schedule-area { padding: 24px 0 40px; }
    .mobile-days { display: none; }
    .schedule-frame { overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: #111; }
    .schedule-grid { display: grid; grid-template-columns: 98px repeat(6, minmax(0,1fr)); }
    .time-column, .day-column { min-width: 0; }
    .column-head {
      height: 72px; padding: 12px 13px; display: flex; flex-direction: column; justify-content: center;
      border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    }
    .time-column .column-head { align-items: center; color: #66665f; font: 10px ui-monospace, monospace; letter-spacing: .1em; }
    .day-name { font-size: 15px; font-weight: 720; }
    .day-date { margin-top: 4px; color: #707069; font: 10px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .day-column.today .column-head { color: var(--ink); background: var(--lime); }
    .day-column.today .day-date { color: #525746; }
    .time-cell, .class-cell { height: var(--row); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .time-cell:last-child, .class-cell:last-child { border-bottom: 0; }
    .day-column:last-child .column-head, .day-column:last-child .class-cell { border-right: 0; }
    .time-cell { padding: 16px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .period { font-size: 14px; font-weight: 720; }
    .section-num { margin-top: 4px; color: #6f6f68; font: 9px ui-monospace, monospace; }
    .time { margin-top: auto; color: #6f6f68; font: 9px/1.45 ui-monospace, monospace; }
    .class-cell { padding: 7px; position: relative; }
    .class-cell.empty::after { content: ""; position: absolute; width: 3px; height: 3px; left: 50%; top: 50%; border-radius: 50%; background: #282826; }
    .course {
      height: 100%; padding: 14px; display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid rgba(255,255,255,.3); border-radius: 14px; color: var(--ink);
    }
    .course h2 { margin: 0; font-size: 14px; line-height: 1.28; letter-spacing: -.025em; font-weight: 760; }
    .teacher { margin-top: 5px; color: rgba(0,0,0,.58); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { margin-top: auto; display: flex; flex-wrap: wrap; gap: 5px; }
    .meta span { padding: 4px 7px; border: 1px solid rgba(0,0,0,.14); border-radius: 999px; background: rgba(255,255,255,.28); font: 8px ui-monospace, monospace; }
    .c-requirements { background: linear-gradient(145deg,#dedbff,#c8d6ff); }
    .c-os { background: linear-gradient(145deg,#b9efda,#d9f7bb); }
    .c-web { background: linear-gradient(145deg,#ffc8a7,#ffd9c5); }
    .c-algorithm { background: linear-gradient(145deg,#c9c5ff,#d5ddff); }
    .c-search { background: linear-gradient(145deg,#aee7f1,#c5f2df); }
    .c-interface { background: linear-gradient(145deg,#f7c8f4,#ded4ff); }
    .c-biology { background: linear-gradient(145deg,#ffe09b,#ffc5a6); }
    .c-politics { background: linear-gradient(145deg,#b9efd7,#aee6cd); }

    .status-line { padding: 16px 3px 0; display: flex; justify-content: space-between; gap: 20px; color: #777770; font-size: 11px; }
    .status-line b { color: #b7b7af; font-weight: 620; }

    @media (max-width: 980px) {
      :root { --row: 132px; }
      .shell { width: min(calc(100% - 28px), 1520px); }
      .toolbar-inner { min-height: 68px; grid-template-columns: 1fr auto; gap: 12px; }
      .week-summary { grid-column: 1 / -1; grid-row: 2; padding: 10px 0 13px; border-top: 1px solid var(--line); }
      .controls { grid-column: 2; grid-row: 1; }
      .mobile-days { margin-bottom: 12px; display: grid; grid-template-columns: repeat(6,1fr); gap: 5px; }
      .day-tab { height: 40px; padding: 0; border: 1px solid var(--line); border-radius: 999px; color: #aaa9a1; background: transparent; cursor: pointer; font-size: 12px; }
      .day-tab.active { color: var(--ink); border-color: var(--lime); background: var(--lime); font-weight: 750; }
      .schedule-grid { grid-template-columns: 76px minmax(0,1fr); }
      .day-column { display: none; }
      .day-column.active { display: block; }
      .day-column.active .column-head, .day-column.active .class-cell { border-right: 0; }
      .course { padding: 15px 17px; }
      .course h2 { font-size: 17px; }
      .teacher { font-size: 12px; }
      .meta span { font-size: 9px; }
    }
    @media (max-width: 480px) {
      .title-wrap h1 { display: none; }
      .week-select { min-width: 88px; }
      .mobile-days { gap: 4px; }
      .status-line { flex-direction: column; gap: 5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-inner shell">
      <div class="title-wrap"><span class="mark">课</span><h1>2026 秋季课表</h1></div>
      <div class="week-summary" aria-live="polite"><strong id="weekTitle">第 1 周</strong><span id="weekRange">08.31 — 09.06</span></div>
      <div class="controls">
        <button class="icon-button" id="prevWeek" type="button" aria-label="上一周">‹</button>
        <select class="week-select" id="weekSelect" aria-label="选择周数"></select>
        <button class="icon-button" id="nextWeek" type="button" aria-label="下一周">›</button>
      </div>
    </div>
  </header>

  <main class="schedule-area">
    <div class="shell">
      <div class="mobile-days" role="tablist" aria-label="选择星期">
        <button class="day-tab active" type="button" data-day="1">一</button>
        <button class="day-tab" type="button" data-day="2">二</button>
        <button class="day-tab" type="button" data-day="3">三</button>
        <button class="day-tab" type="button" data-day="4">四</button>
        <button class="day-tab" type="button" data-day="5">五</button>
        <button class="day-tab" type="button" data-day="6">六</button>
      </div>

      <div class="schedule-frame">
        <div class="schedule-grid" id="scheduleGrid">
          <div class="time-column">
            <div class="column-head">TIME</div>
            <div class="time-cell"><span class="period">一</span><span class="section-num">01—02</span><span class="time">08:00<br>09:40</span></div>
            <div class="time-cell"><span class="period">二</span><span class="section-num">03—04</span><span class="time">10:10<br>11:50</span></div>
            <div class="time-cell"><span class="period">三</span><span class="section-num">05—06</span><span class="time">14:00<br>15:40</span></div>
            <div class="time-cell"><span class="period">四</span><span class="section-num">07—08</span><span class="time">16:10<br>17:50</span></div>
            <div class="time-cell"><span class="period">五</span><span class="section-num">09—10</span><span class="time">18:30<br>20:05</span></div>
          </div>
        </div>
      </div>
      <div class="status-line"><span id="sessionCount"></span><span>第一周：<b>08.31 — 09.06</b> · 共 16 周</span></div>
    </div>
  </main>

  <script>
    const termStart = new Date(2026, 7, 31, 12);
    const weekCount = 16;
    const days = ['周一','周二','周三','周四','周五','周六'];
    const courses = [
      { day:1, period:1, name:'软件需求分析与建模', teacher:'马于涛 教授', room:'2N108', weeks:[1,16], type:'requirements' },
      { day:4, period:2, name:'软件需求分析与建模', teacher:'马于涛 教授', room:'2N108', weeks:[9,16], type:'requirements' },
      { day:2, period:1, name:'操作系统原理', teacher:'喻莹 副教授', room:'2N113', weeks:[1,16], type:'os' },
      { day:4, period:5, name:'操作系统原理', teacher:'喻莹 副教授', room:'2N113', weeks:[1,16], type:'os' },
      { day:3, period:1, name:'Web 程序设计', teacher:'涂新辉 副教授', room:'2N522', weeks:[1,16], type:'web' },
      { day:5, period:4, name:'Web 程序设计', teacher:'涂新辉 副教授', room:'2N522', weeks:[1,16], type:'web' },
      { day:4, period:1, name:'算法设计与分析', teacher:'李增扬 副教授', room:'2N108', weeks:[1,15], type:'algorithm' },
      { day:2, period:3, name:'算法设计与分析', teacher:'李增扬 副教授', room:'2N108', weeks:[1,15], type:'algorithm' },
      { day:3, period:2, name:'信息检索技术', teacher:'李蓉 讲师（高校）', room:'2N309', weeks:[1,8], type:'search' },
      { day:1, period:5, name:'信息检索技术', teacher:'李蓉 讲师（高校）', room:'2N320', weeks:[1,16], type:'search' },
      { day:5, period:2, name:'接口技术', teacher:'陈怡 副教授', room:'2N309', weeks:[1,15], type:'interface' },
      { day:2, period:4, name:'接口技术', teacher:'陈怡 副教授', room:'2N213', weeks:[1,15], type:'interface' },
      { day:1, period:4, name:'生物信息学', teacher:'裴羽尘 讲师（高校）', room:'2N320', weeks:[1,16], type:'biology' },
      { day:3, period:3, name:'形势与政策（5）', teacher:'肖克 助教（思政）', room:'2N207', weeks:[9,11,13,15], type:'politics' }
    ];

    const select = document.querySelector('#weekSelect');
    const prev = document.querySelector('#prevWeek');
    const next = document.querySelector('#nextWeek');
    const grid = document.querySelector('#scheduleGrid');
    const tabs = [...document.querySelectorAll('.day-tab')];
    for (let week = 1; week <= weekCount; week++) {
      const option = document.createElement('option');
      option.value = week; option.textContent = `第 ${week} 周`; select.append(option);
    }

    const pad = number => String(number).padStart(2,'0');
    const formatDate = date => `${pad(date.getMonth()+1)}.${pad(date.getDate())}`;
    const dateFor = (week, dayOffset = 0) => {
      const date = new Date(termStart); date.setDate(date.getDate() + (week-1)*7 + dayOffset); return date;
    };
    const runsInWeek = (rule, week) => rule.length === 2 && rule[1] >= rule[0]
      ? week >= rule[0] && week <= rule[1]
      : rule.includes(week);
    const weekLabel = rule => rule.length === 2 && rule[1] >= rule[0]
      ? `${rule[0]}—${rule[1]} 周`
      : `${rule.join('·')} 周`;
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));

    function initialWeek() {
      const saved = Number(localStorage.getItem('schedule-week'));
      if (saved >= 1 && saved <= weekCount) return saved;
      const now = new Date();
      const difference = Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate(),12) - termStart) / 86400000);
      const current = Math.floor(difference / 7) + 1;
      return Math.min(weekCount, Math.max(1, current));
    }

    function selectDay(day) {
      tabs.forEach(tab => { const active = Number(tab.dataset.day) === day; tab.classList.toggle('active',active); tab.setAttribute('aria-selected',active); });
      document.querySelectorAll('.day-column').forEach(column => column.classList.toggle('active',Number(column.dataset.day) === day));
      localStorage.setItem('schedule-day', day);
    }

    function render(week) {
      grid.querySelectorAll('.day-column').forEach(column => column.remove());
      const monday = dateFor(week);
      const sunday = dateFor(week,6);
      const now = new Date();
      const todayKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
      const activeCourses = courses.filter(course => runsInWeek(course.weeks,week));
      for (let day = 1; day <= 6; day++) {
        const date = dateFor(week,day-1);
        const dateKey = `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
        const column = document.createElement('section');
        column.className = 'day-column'; column.dataset.day = day;
        if (dateKey === todayKey) column.classList.add('today');
        column.innerHTML = `<div class="column-head"><span class="day-name">${days[day-1]}</span><span class="day-date">${formatDate(date)}</span></div>`;
        for (let period = 1; period <= 5; period++) {
          const course = activeCourses.find(item => item.day === day && item.period === period);
          const cell = document.createElement('div');
          cell.className = `class-cell${course ? '' : ' empty'}`;
          if (course) cell.innerHTML = `<article class="course c-${course.type}"><h2>${escapeHtml(course.name)}</h2><div class="teacher">${escapeHtml(course.teacher)}</div><div class="meta"><span>${weekLabel(course.weeks)}</span><span>${escapeHtml(course.room)}</span></div></article>`;
          column.append(cell);
        }
        grid.append(column);
      }
      document.querySelector('#weekTitle').textContent = `第 ${week} 周`;
      document.querySelector('#weekRange').textContent = `${formatDate(monday)} — ${formatDate(sunday)}`;
      document.querySelector('#sessionCount').innerHTML = `本周 <b>${activeCourses.length}</b> 次课 · <b>${new Set(activeCourses.map(course=>course.name)).size}</b> 门课程`;
      select.value = week; prev.disabled = week === 1; next.disabled = week === weekCount;
      localStorage.setItem('schedule-week',week);
      const savedDay = Number(localStorage.getItem('schedule-day'));
      const currentDay = now.getDay();
      selectDay(savedDay >= 1 && savedDay <= 6 ? savedDay : (currentDay >= 1 && currentDay <= 6 ? currentDay : 1));
    }

    tabs.forEach(tab => tab.addEventListener('click',() => selectDay(Number(tab.dataset.day))));
    select.addEventListener('change',() => render(Number(select.value)));
    prev.addEventListener('click',() => render(Number(select.value)-1));
    next.addEventListener('click',() => render(Number(select.value)+1));
    render(initialWeek());
  </script>
</body>
</html>
